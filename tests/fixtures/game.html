<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Autodev isolated game fixture</title>
<style>body{font:20px system-ui;max-width:600px;margin:40px auto;padding:16px;background:#132333;color:white}button{font:inherit;padding:16px;margin:8px;background:#7de2c4;border:0;border-radius:8px}#board{padding:24px;border:2px solid #7de2c4}</style>
<h1>Collect three stars</h1><div id="board"><p id="status">Ready</p><p>Score: <span id="score">0</span></p><button id="start">Start</button><button id="collect">Collect star</button><button id="restart">Restart</button></div>
<script>let score=0,playing=false;start.onclick=()=>{playing=true;statusText('Playing')};function statusText(s){document.querySelector('#status').textContent=s}collect.onclick=()=>{if(playing){score++;document.querySelector('#score').textContent=score;if(score===3){statusText('Won');playing=false}}};restart.onclick=()=>{score=0;playing=false;document.querySelector('#score').textContent=score;statusText('Ready')};</script></html>
